<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Download the Android APK file.">
  <title>APK Download</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f3f6fb;color:#182230;min-height:100vh;display:grid;place-items:center;padding:24px}
    .card{width:min(100%,480px);background:#fff;border:1px solid #e5eaf2;border-radius:24px;padding:30px;box-shadow:0 18px 55px rgba(25,45,80,.10);text-align:center}
    .icon{width:86px;height:86px;margin:0 auto 18px;border-radius:22px;background:linear-gradient(135deg,#1769ff,#19b7a5);display:grid;place-items:center;color:white;font-size:38px;font-weight:800}
    h1{font-size:27px;margin:0 0 8px;overflow-wrap:anywhere}
    .sub{color:#667085;line-height:1.6;margin:0 0 24px}
    .info{background:#f7f9fc;border-radius:14px;padding:14px 16px;text-align:left;margin:0 0 22px;font-size:14px;color:#475467}
    .info div{display:flex;justify-content:space-between;gap:12px;padding:5px 0}
    .info strong{color:#182230}
    .download{display:block;text-decoration:none;background:#1769ff;color:#fff;padding:15px 18px;border-radius:13px;font-weight:750;font-size:17px;transition:transform .15s,background .15s}
    .download:hover{background:#0e55d9;transform:translateY(-1px)}
    .note{font-size:12px;color:#7a8495;line-height:1.6;margin:18px 0 0}
    footer{font-size:12px;color:#98a2b3;margin-top:22px}
  </style>
</head>
<body>
  <main class="card">
    <div class="icon" aria-hidden="true">APK</div>
    <h1>APK Download</h1>
    <p class="sub">নিচের বাটনে চাপ দিয়ে Android APK ফাইলটি ডাউনলোড করুন।</p>
    <section class="info" aria-label="File details">
      <div><span>ফাইলের নাম</span><strong>base.apk</strong></div>
      <div><span>ফাইলের ধরন</span><strong>Android APK</strong></div>
      <div><span>ফাইলের সাইজ</span><strong>প্রায় 6.6 MB</strong></div>
    </section>
    <a class="download" href="./base.apk" download="base.apk">⬇ Download APK</a>
    <p class="note">শুধু বিশ্বাসযোগ্য উৎসের APK ইনস্টল করুন। ইনস্টল করার আগে Android-এর নিরাপত্তা সতর্কতা যাচাই করুন।</p>
    <footer>APK Download Page</footer>
  </main>
</body>
</html>
